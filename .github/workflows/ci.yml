name: Application Foundation CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
      - 'agent/**'

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pci_dev
          POSTGRES_PASSWORD: pci_dev_password
          POSTGRES_DB: pci_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pci_dev -d pci_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://pci_dev:pci_dev_password@localhost:5432/pci_dev
      TEST_DATABASE_URL: postgres://pci_dev:pci_dev_password@localhost:5432/pci_dev
      DATABASE_SSL: 'false'
      DEV_AUTH_ENABLED: 'false'
      CORS_ORIGIN: http://localhost:5173
      VITE_API_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # NOTA: usa "npm install" en lugar de "npm ci" porque package-lock.json
      # todavía no está commiteado (ver README.md y WORKLOG.md, sección
      # "Bloqueos"). Cuando se agregue el lockfile, cambiar a "npm ci" y
      # restaurar "cache: npm" arriba.
      - name: Install dependencies
        run: npm install

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Verify migrations are idempotent (second run is a no-op)
        run: npm run db:migrate

      - name: Seed reference data
        run: npm run db:seed

      - name: Verify seeds are idempotent (second run does not duplicate)
        run: npm run db:seed

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
